services:
  db:
    image: mysql:8.0
    container_name: reforma_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      MYSQL_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: reforma_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?Defina APP_AUTH_USERNAME no arquivo .env}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Defina APP_AUTH_PASSWORD no arquivo .env}
      DB_HOST: db
      DB_NAME: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      DB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      DB_PASS: ${DB_PASS:?Defina DB_PASS no arquivo .env}
      DB_CHARSET: utf8mb4
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8000:80"
    volumes:
      - ./api:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    container_name: reforma_backoffice
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?Defina APP_AUTH_USERNAME no arquivo .env}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Defina APP_AUTH_PASSWORD no arquivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      API_INTERNAL_URL: http://api
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8001:80"
    volumes:
      - ./backoffice:/var/www/html

  dashboards:
    build:
      context: ./dashboards
      dockerfile: Dockerfile
    container_name: reforma_dashboards
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?Defina APP_AUTH_USERNAME no arquivo .env}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Defina APP_AUTH_PASSWORD no arquivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8002:80"
    volumes:
      - ./dashboards:/var/www/html

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: reforma_phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      PMA_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
      UPLOAD_LIMIT: 512M
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8080:80"

volumes:
  db_data:
